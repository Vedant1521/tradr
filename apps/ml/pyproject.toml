[project]
name = "tradr-ml"
version = "0.1.0"
description = "Machine Learning services for Tradr"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.1",
    "click>=8.1.7",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "psycopg[binary]>=3.1.18",
    "redis>=5.0.3",
    "aiokafka>=0.10.0",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.29",
    "tqdm>=4.66.2",
]

[project.scripts]
tradr-ml = "tradr_ml.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ruff>=0.3.5",
    "mypy>=1.9.0",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pre-commit>=3.7.0"
]
